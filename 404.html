<script>
(function () {
  try {
    var d = document.documentElement;
    var t = localStorage.getItem('vma-theme');

    var l = localStorage.getItem('vma-lang');
    if (l === 'en' || l === 'zh') { d.setAttribute('data-lang', l); d.setAttribute('lang', l); }

})();
